global:
  name: consul
  datacenter: dc1
  acls:
    manageSystemACLs: true

ui:
  enabled: true

server:
  replicas: 3
  bootstrapExpect: 3

  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 3

  acls:
    manageSystemACLs: yes
  persistence:
    enabled: true
    size: 10Gi
    storageClass: efs-sc
    accessMode: ReadWriteMany

uiService:
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
  externalTrafficPolicy: Local

serviceAccount:
  create: false
  name: consul-sa
