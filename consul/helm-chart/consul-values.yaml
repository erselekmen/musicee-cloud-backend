global:
  name: consul
  datacenter: dc1
  acls:
    manageSystemACLs: true

client:
  enabled: true
  grpc: true

ui:
  enabled: true

server:
  replicas: 3
  bootstrapExpect: 3
  acls:
    manageSystemACLs: yes
  connectInject:
    enabled: false
  persistence:
    enabled: true
    size: 10Gi
    storageClass: efs-sc
    accessMode: ReadWriteMany

uiService:
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"  # Use "alb" for Application Load Balancer
  externalTrafficPolicy: Local

serviceAccount:
  create: false
  name: consul-sa
